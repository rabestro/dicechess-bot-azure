version: 2
updates:
  - package-ecosystem: "sbt"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - rabestro
    labels:
      - dependencies
      - scala
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - rabestro
    labels:
      - dependencies
      - ci-cd
    commit-message:
      prefix: "chore"
      include: "scope"
