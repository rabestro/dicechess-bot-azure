name: CI

on:
  push:
    branches: [main]
  pull_request:

# packages: read — resolves lv.id.jc:dicechess-engine-scala from GitHub Packages with the
# default token (same pattern as dicechess-house-bots).
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native-image:
    name: Native image (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build native image
        run: sbt nativeImage
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-run the binary
        run: |
          chmod +x target/native-image/dicechess-bot
          DICECHESS_WEBHOOK_SECRET=smoke FUNCTIONS_CUSTOMHANDLER_PORT=8099 ./target/native-image/dicechess-bot &
          sleep 2
          RESPONSE=$(curl -s -X POST http://127.0.0.1:8099/api/webhook \
            -H "Content-Type: application/json" \
            -d '{"type":"verification","nonce":"ci-smoke"}')
          echo "handshake response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"nonce":"ci-smoke"' || (echo "handshake failed" && exit 1)
          kill %1

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: dicechess-bot-linux-x64
          path: target/native-image/dicechess-bot
          if-no-files-found: error
